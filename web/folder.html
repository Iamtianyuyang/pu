<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>pu~</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='1' y='1' width='30' height='30' rx='8' fill='%230a0e14'/%3E%3Cpath d='M7 13c1-4 4.5-6.5 9-6.5 5 0 9 3.5 9 8 0 4.5-3.5 8-8.5 8H12' fill='none' stroke='%235eead4' stroke-width='2.6' stroke-linecap='round'/%3E%3Ccircle cx='24.5' cy='9.5' r='1.7' fill='%235eead4'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0a0e14;
  --surface:#11161f;
  --surface-2:#171e29;
  --line:#212c3b;
  --line-strong:#2e3c50;
  --text:#e8eef6;
  --text-2:#9fb0c3;
  --text-3:#7c8ca0;
  --mint:#5eead4;
  --mint-ink:#0c2b23;
  --amber:#f5b83d;
  --red:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(900px 380px at 85% -8%, rgba(94,234,212,.05), transparent 60%),
    var(--bg);
  color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:max(22px,env(safe-area-inset-top)) 18px calc(30px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
}
@media (min-width:600px){ body{ padding-top:48px } }

/* ── header ── */
header{display:flex;align-items:center;gap:11px}
.logo{width:32px;height:32px;flex:none;filter:drop-shadow(0 2px 10px rgba(94,234,212,.25))}
h1{font-size:17px;font-weight:700;letter-spacing:.4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.count{margin-left:auto;flex:none;font-size:12.5px;color:var(--text-2);
  border:1px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}

/* ── list ── */
#list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:13px;background:var(--surface);border:1px solid var(--line);
  border-radius:14px;padding:13px 15px;cursor:pointer;
  transition:border-color .15s, transform .12s ease-out, opacity .2s}
.row:hover{border-color:var(--line-strong)}
.row:hover .name{color:var(--text)}
.row:active{transform:scale(.99)}
.row.loading{opacity:.55;pointer-events:none}
.row .idx{font-size:12px;color:var(--text-3);width:26px;flex:none;text-align:right;font-variant-numeric:tabular-nums}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-2);transition:color .15s}
.row .size{font-size:12px;color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}
.badge{font-size:11.5px;padding:3px 10px;border-radius:999px;border:1px solid var(--line);color:var(--text-3);flex:none;white-space:nowrap}
.badge.transcoding{color:var(--amber);border-color:rgba(245,184,61,.35)}
.badge.transcoding::before{content:"●";font-size:8px;vertical-align:1px;margin-right:5px;animation:blink 1.1s ease-in-out infinite}
.badge.serving{color:var(--mint-ink);background:var(--mint);border-color:var(--mint);font-weight:600}
.badge.failed{color:var(--red);border-color:rgba(248,113,113,.35)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){ .badge.transcoding::before{animation:none} }

/* ── skeleton / empty ── */
.skel{height:50px;border-radius:14px;background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2) 50%,var(--surface) 60%);
  background-size:200% 100%;animation:shine 1.4s infinite linear}
@keyframes shine{to{background-position:-200% 0}}
@media (prefers-reduced-motion: reduce){ .skel{animation:none} }
.hint{font-size:13px;color:var(--text-3);text-align:center;padding:46px 0;line-height:1.9}
.hint strong{display:block;font-size:15px;color:var(--text-2);font-weight:600}
</style>
</head>
<body>
<header>
  <svg class="logo" viewBox="0 0 32 32"><rect x="1" y="1" width="30" height="30" rx="8" fill="#11161f"/><path d="M7 13c1-4 4.5-6.5 9-6.5 5 0 9 3.5 9 8 0 4.5-3.5 8-8.5 8H12" fill="none" stroke="#5eead4" stroke-width="2.6" stroke-linecap="round"/><circle cx="24.5" cy="9.5" r="1.7" fill="#5eead4"/></svg>
  <h1 id="title">pu~</h1>
  <span class="count" id="count"></span>
</header>
<div id="list">
  <div class="skel"></div>
  <div class="skel"></div>
  <div class="skel"></div>
</div>
<script>
(function(){
  var token = location.pathname.split('/')[2];
  if (!token) { document.body.innerHTML = '<p style="padding:40px;text-align:center">链接无效</p>'; return; }
  var list = document.getElementById('list');
  var title = document.getElementById('title');
  var count = document.getElementById('count');
  var STATE_TEXT = { new:'未打开', transcoding:'转码中', serving:'就绪', failed:'失败' };
  var lastKey = '';

  function fmtSize(b){
    if (b >= 1 << 30) return (b / (1 << 30)).toFixed(1) + ' GB';
    if (b >= 1 << 20) return Math.round(b / (1 << 20)) + ' MB';
    return Math.max(1, Math.round(b / 1024)) + ' KB';
  }

  function esc(s){ return s.replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

  function render(st){
    title.textContent = st.title || 'pu~';
    document.title = (st.title || 'pu~') + ' · pu~';
    if (st.files.length === 0){
      list.innerHTML = '<div class="hint"><strong>这个文件夹里没有视频</strong>支持常见视频与音频格式<br>试试右键一个文件夹，或打开别的目录</div>';
      count.textContent = '0 个文件';
      return;
    }
    count.textContent = st.count + ' 个文件';
    var key = st.files.map(function(f){ return f.index + ':' + f.state; }).join('|');
    if (key === lastKey) return; // 状态没变不重建 DOM
    lastKey = key;
    var html = '';
    st.files.forEach(function(f){
      var t = STATE_TEXT[f.state] || f.state;
      html += '<div class="row" data-i="' + f.index + '">'
        + '<span class="idx">' + (f.index + 1) + '</span>'
        + '<span class="name">' + esc(f.name) + '</span>'
        + '<span class="size">' + fmtSize(f.sizeBytes) + '</span>'
        + '<span class="badge ' + f.state + '">' + t + '</span>'
        + '</div>';
    });
    list.innerHTML = html;
  }

  list.addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if (!row || row.classList.contains('loading')) return;
    row.classList.add('loading');
    var i = row.getAttribute('data-i');
    fetch('/f/' + token + '/open/' + i, { method:'POST' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){ if (d.url) location.href = d.url; })
      .catch(function(){ row.classList.remove('loading'); });
  });

  function tick(){
    fetch('/f/' + token + '/status', { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function(){});
  }
  tick();
  setInterval(tick, 2000);
})();
</script>
</body>
</html>
