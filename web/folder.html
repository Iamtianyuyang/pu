<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="噗~噗噗~~噗噗噗噗~~~~~~~~ 局域网媒体文件列表">
<title>噗~噗噗~~噗噗噗噗~~~~~~~~</title>
<link rel="icon" type="image/png" href="/assets/pu-logo.png">
<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#eef2f9;
  --line:#dce3ee;
  --line-strong:#c2cede;
  --text:#1e2735;
  --text-2:#4f5c72;
  --text-3:#66738a;
  --blue:#2f5bb5;
  --blue-deep:#1d3f86;
  --blue-soft:#e9effa;
  --green:#2e9463;
  --green-ink:#21724c;
  --green-soft:#e4f4ec;
  --amber-ink:#8a5a10;
  --amber-soft:#fdf3e0;
  --amber-line:#ecd9ae;
  --red:#c02f47;
  --red-soft:#fbeef0;
  --red-line:#efc9cf;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(700px 380px at -10% -8%, #e9eff9 0, transparent 62%),
    radial-gradient(620px 420px at 110% 14%, #e7f0fb 0, transparent 64%),
    var(--bg);
  color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom));
  max-width:640px;margin:0 auto;
  display:flex;flex-direction:column;gap:14px;
  min-height:100svh;box-sizing:border-box;
}
@media (min-width:600px){ body{ padding-top:48px } }
::selection{background:rgba(47,91,181,.18)}

/* ── header ── */
header{display:flex;align-items:center;gap:13px;min-height:56px;margin-bottom:4px}
.logo{width:56px;height:56px;flex:none;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(47,91,181,.16))}
h1{font-size:19px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.count{margin-left:auto;flex:none;font-size:12.5px;font-weight:550;color:var(--text-2);
  border:1px solid var(--line);border-radius:999px;padding:5px 12px;background:var(--surface)}

/* ── list ── */
#list{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:13px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);
  border-radius:16px;padding:13px 16px;cursor:pointer;font-family:inherit;font-size:15px;
  box-shadow:0 8px 22px rgba(35,55,95,.05);
  transition:border-color .18s,background .18s,box-shadow .18s,transform .12s var(--ease-out),opacity .2s}
.row:hover{border-color:var(--line-strong);background:#fbfdff;box-shadow:0 10px 26px rgba(35,55,95,.08)}
.row:hover .name{color:var(--text)}
.row:hover .chev{opacity:1;transform:none}
.row:active{transform:scale(.99)}
.row:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.row.loading{opacity:.58;pointer-events:none}
.row.failed{border-color:var(--red-line);background:var(--red-soft)}
.row .idx{font-size:11.5px;color:var(--text-3);width:26px;flex:none;text-align:right;
  font-variant-numeric:tabular-nums}
.row .name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  color:var(--text-2);font-size:14px;transition:color .15s}
.row .size{font-size:12px;color:var(--text-3);flex:none;font-variant-numeric:tabular-nums}
.row .chev{width:16px;height:16px;flex:none;stroke:var(--text-3);fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;
  opacity:.42;transition:opacity .18s,transform .18s var(--ease-out)}
.badge{font-size:11.5px;font-weight:550;padding:3px 10px;border-radius:999px;
  border:1px solid var(--line);color:var(--text-3);background:var(--surface-2);
  flex:none;white-space:nowrap}
.badge.transcoding{color:var(--amber-ink);border-color:var(--amber-line);background:var(--amber-soft)}
.badge.transcoding::before{content:"●";font-size:8px;vertical-align:1px;margin-right:5px;animation:blink 1.1s ease-in-out infinite}
.badge.serving{color:#fff;background:var(--green);border-color:var(--green);font-weight:600}
.badge.failed{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
@keyframes blink{50%{opacity:.25}}
@media (prefers-reduced-motion: reduce){
  .badge.transcoding::before{animation:none}
  .skel{animation:none}
  .row,.row .chev{transition:none}
}

/* ── skeleton / empty ── */
.skel{height:54px;border-radius:16px;background:linear-gradient(100deg,var(--surface) 40%,var(--surface-2) 50%,var(--surface) 60%);
  background-size:200% 100%;animation:shine 1.4s infinite linear}
@keyframes shine{to{background-position:-200% 0}}
.hint{font-size:13px;color:var(--text-3);text-align:center;padding:46px 0;line-height:1.9}
.hint strong{display:block;font-size:15px;color:var(--text-2);font-weight:600}

/* ── footer：循环夸词 ── */
.foot{margin-top:auto;text-align:center;font-size:11px;color:var(--text-3);
  padding:6px 0 2px;letter-spacing:.3px}
.foot span{display:inline-block;transition:opacity .32s ease,transform .32s ease}
.foot span.swap{opacity:0;transform:translateY(4px)}
@media (prefers-reduced-motion:reduce){.foot span{transition:none}}
</style>
</head>
<body>
<header>
  <img class="logo" src="/assets/pu-logo.png" alt="噗~">
  <h1 id="title">噗~噗噗~~噗噗噗噗~~~~~~~~</h1>
  <span class="count" id="count"></span>
</header>
<div id="list" role="list">
  <div class="skel"></div>
  <div class="skel"></div>
  <div class="skel"></div>
</div>
<script>
(function(){
  var token = location.pathname.split('/')[2];
  if (!token) { document.body.innerHTML = '<p style="padding:40px;text-align:center">链接无效</p>'; return; }
  var list = document.getElementById('list');
  var title = document.getElementById('title');
  var count = document.getElementById('count');
  var STATE_TEXT = { new:'未打开', transcoding:'转码中', serving:'就绪', failed:'失败' };
  var lastKey = '';

  function fmtSize(b){
    if (b >= 1 << 30) return (b / (1 << 30)).toFixed(1) + ' GB';
    if (b >= 1 << 20) return Math.round(b / (1 << 20)) + ' MB';
    return Math.max(1, Math.round(b / 1024)) + ' KB';
  }

  function esc(s){ return s.replace(/[&<>"']/g, function(c){
    return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

  function render(st){
    title.textContent = st.title || '噗~噗噗~~噗噗噗噗~~~~~~~~';
    document.title = (st.title || '噗~噗噗~~噗噗噗噗~~~~~~~~') + ' · 噗~噗噗~~噗噗噗噗~~~~~~~~';
    if (st.files.length === 0){
      list.innerHTML = '<div class="hint"><strong>这个文件夹里没有视频</strong>支持常见视频与音频格式<br>试试右键一个文件夹，或打开别的目录</div>';
      count.textContent = '0 个文件';
      return;
    }
    count.textContent = st.count + ' 个文件';
    var key = st.files.map(function(f){ return f.index + ':' + f.state; }).join('|');
    if (key === lastKey) return; // 状态没变不重建 DOM
    lastKey = key;
    var html = '';
    st.files.forEach(function(f){
      var t = STATE_TEXT[f.state] || f.state;
      html += '<button type="button" class="row" data-i="' + f.index + '" role="listitem">'
        + '<span class="idx">' + (f.index + 1) + '</span>'
        + '<span class="name">' + esc(f.name) + '</span>'
        + '<span class="size">' + fmtSize(f.sizeBytes) + '</span>'
        + '<span class="badge ' + f.state + '">' + t + '</span>'
        + '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 6l6 6-6 6"/></svg>'
        + '</button>';
    });
    list.innerHTML = html;
  }

  list.addEventListener('click', function(e){
    var row = e.target.closest('.row');
    if (!row || row.classList.contains('loading')) return;
    row.classList.add('loading');
    var i = row.getAttribute('data-i');
    fetch('/f/' + token + '/open/' + i, { method:'POST' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){ if (d.url) location.href = d.url; })
      .catch(function(){
        row.classList.remove('loading');
        row.classList.add('failed');
        var badge = row.querySelector('.badge');
        if (badge) badge.textContent = '打开失败';
        setTimeout(function(){ row.classList.remove('failed'); lastKey = ''; tick(); }, 1600);
      });
  });

  function tick(){
    fetch('/f/' + token + '/status', { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function(){});
  }
  tick();
  setInterval(tick, 2000);
})();
</script>
<footer class="foot"><span id="queen">全世界最可爱的噗噗大王~</span></footer>
<script>
(function(){
  var words = ['全世界最可爱','无敌漂亮','闪闪发光','人见人爱','笑起来超甜','元气满满','聪明伶俐','宇宙第一美少女'];
  var el = document.getElementById('queen');
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i = 0;
  setInterval(function(){
    i = (i + 1) % words.length;
    if (reduced) { el.textContent = words[i] + '的噗噗大王~'; return; }
    el.classList.add('swap');
    setTimeout(function(){
      el.textContent = words[i] + '的噗噗大王~';
      el.classList.remove('swap');
    }, 320);
  }, 2800);
})();
</script>
</body>
</html>
