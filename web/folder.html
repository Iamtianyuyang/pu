<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F9F9F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11141B" media="(prefers-color-scheme: dark)">
<meta name="description" content="噗~噗噗~~噗噗噗噗~~~~ 局域网媒体文件列表">
<title>噗~噗噗~~噗噗噗噗~~~~</title>
<link rel="icon" type="image/png" href="/assets/pu-logo.png">
<link rel="stylesheet" href="/assets/pu.css">
<style>
.head{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:end;margin-top:4px}
.head .mascot{width:84px;height:84px;grid-row:span 2}
.head .bubble{justify-self:start;align-self:end;margin-bottom:6px}
.head h1{grid-column:1 / -1;font-size:24px;font-weight:800;line-height:1.3;letter-spacing:-.3px;word-break:break-word;margin-top:12px}
.meta{font-size:14px;color:var(--text-3);margin-top:2px}

.resume{display:flex;align-items:center;gap:14px;margin-top:18px;padding:13px 14px 13px 16px;border-radius:16px;
  background:var(--ink-soft);border:1.5px solid transparent;width:100%;text-align:left}
.resume:hover{border-color:var(--ink)}
.resume .txt{flex:1;min-width:0}
.resume small{display:block;font-size:12.5px;font-weight:700;color:var(--ink)}
.resume b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.resume .go{flex:none;display:flex;align-items:center;gap:4px;font-weight:700;color:var(--ink);font-size:14px}
.resume .go svg{width:18px;height:18px}

/* 列表：不是一格格卡片，是作业本上一行一行写下来的 */
.list{list-style:none;margin-top:20px;border-top:1.5px solid var(--line)}
.list li{border-bottom:1.5px solid var(--line)}
.row{display:grid;grid-template-columns:34px minmax(0,1fr) auto;align-items:center;gap:4px 10px;width:100%;
  min-height:62px;padding:10px 4px 10px 2px;text-align:left;transition:background .15s}
.row:hover{background:var(--ink-soft)}
.row:focus-visible{outline-offset:-2px}
.row .no{font-size:14px;font-weight:700;color:var(--text-3);text-align:right;font-variant-numeric:tabular-nums;padding-right:4px}
.row .name{font-size:15px;line-height:1.4;color:var(--text);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;word-break:break-all}
.row .sub{grid-column:2;font-size:12.5px;color:var(--text-3);display:flex;gap:10px;flex-wrap:wrap}
.row .state{grid-column:3;grid-row:1 / span 2;font-size:13px;font-weight:700;white-space:nowrap;text-align:right}
.row .state.transcoding{color:var(--warn)}
.row .state.serving{color:var(--ok)}
.row .state.failed{color:var(--bad)}
.row .done{color:var(--ok)}
.row.opening{opacity:.55;pointer-events:none}
.row.current .no{color:var(--ink)}
.row.current .name{font-weight:700}

.note{font-size:13.5px;color:var(--text-3);text-align:center;padding:18px 0}
.empty{padding:36px 0 10px;text-align:center}
.empty .mascot{width:112px;height:112px;margin:0 auto}
.empty h2{font-size:18px;margin-top:14px}
.empty p{font-size:14px;color:var(--text-2);margin-top:4px}
.skel{height:62px;border-bottom:1.5px solid var(--line);background:linear-gradient(100deg,transparent 30%,var(--ink-soft) 50%,transparent 70%);
  background-size:200% 100%;animation:shine 1.4s infinite linear}
@keyframes shine{to{background-position:-200% 0}}

.qr-aside{display:none}
@media (min-width:900px){
  .page.wide{max-width:980px}
  .layout{display:grid;grid-template-columns:minmax(0,1fr) 260px;gap:56px;align-items:start}
  .qr-aside{display:block;position:sticky;top:24px;margin-top:24px;background:var(--card);border:1.5px solid var(--line);border-radius:20px;padding:20px;text-align:center}
  .qr-aside h2{font-size:15px;font-weight:700}
  .qr-aside p{font-size:13px;color:var(--text-2)}
  .qr-aside .qr-box{margin:12px auto 0}
}
@media (prefers-reduced-motion:reduce){.skel{animation:none}.row{transition:none}}
</style>
</head>
<body>
<div class="page wide">
  <header class="topbar">
    <span class="grow"></span>
    <button type="button" class="btn btn-quiet" id="shareBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="6" height="6" rx="1"/><rect x="14.5" y="3.5" width="6" height="6" rx="1"/><rect x="3.5" y="14.5" width="6" height="6" rx="1"/><path d="M14.5 14.5h2.5v2.5M20.5 14.5v.01M14.5 20.5h6v-3"/></svg>分享</button>
  </header>
  <div class="offline" id="offline" hidden>和电脑断开了，正在重连…</div>
  <div class="layout">
    <main>
      <div class="head">
        <div class="mascot" id="mascot"></div>
        <p class="bubble" id="bubble" hidden></p>
        <h1 id="title">噗~噗噗~~噗噗噗噗~~~~</h1>
      </div>
      <p class="meta" id="meta"></p>
      <button type="button" class="resume" id="resume" hidden>
        <span class="txt"><small id="resumeLabel">上次看到这里</small><b id="resumeName"></b></span>
        <span class="go">接着看<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg></span>
      </button>
      <ol class="list" id="list" aria-label="媒体文件">
        <li class="skel"></li><li class="skel"></li><li class="skel"></li>
      </ol>
      <p class="note" id="truncNote" hidden>文件太多了，这里只列出前 500 个</p>
    </main>
    <aside class="qr-aside" aria-label="扫码在手机上看">
      <h2>在手机上看</h2>
      <p>同一个 Wi-Fi 下扫一扫</p>
      <div class="qr-box"><img id="asideQr" alt="当前页面的二维码"></div>
    </aside>
  </div>
  <footer class="brand-foot">噗~噗噗~~噗噗噗噗~~~~</footer>
</div>
<script src="/assets/pu.js"></script>
<script>
(function(){
  var token = location.pathname.split('/')[2];
  if (!token){ document.body.innerHTML = '<p style="padding:40px;text-align:center">链接无效</p>'; return; }
  var $ = Pu.$, dev = Pu.device();
  var list = $('list'), mascot = Pu.mascot($('mascot'), 'idle'), bubble = Pu.bubble($('bubble'));
  var STATE = { transcoding: '转码中', serving: '就绪', failed: '失败' };
  var lastKey = '', files = [], folderTitle = '';

  Pu.words().then(function(w){ bubble.say(Pu.praise(w), 2800); }).catch(function(){});
  var qr = function(u){ return '/f/' + token + '/qr.png?u=' + encodeURIComponent(u); };
  $('asideQr').src = qr(location.href);
  var share = Pu.shareSheet(qr, function(){ return location.href; });
  $('shareBtn').addEventListener('click', share.open);

  function stripExt(n){ return n.replace(/\.[^.]+$/, ''); }
  function esc(s){ return s.replace(/[&<>"']/g, function(c){ return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]; }); }

  // 本机观看记录（播放页写的）：看到哪、看完没有。只存在这台设备的浏览器里
  function watched(f){
    var t = stripExt(f.name);
    if (Pu.store.get('pu:done:' + t)) return '<span class="done">看完了</span>';
    var pos = parseFloat(Pu.store.get('pu:pos:' + t) || '0');
    return pos >= 15 ? '<span>看到 ' + Pu.fmtTime(pos) + '</span>' : '';
  }

  function render(st){
    folderTitle = st.title || '';
    $('title').textContent = folderTitle || '噗~噗噗~~噗噗噗噗~~~~';
    document.title = (folderTitle || '噗~噗噗~~噗噗噗噗~~~~');
    files = st.files || [];
    $('truncNote').hidden = !st.truncated;
    if (files.length === 0){
      mascot.set('empty'); bubble.hide();
      $('meta').textContent = '';
      list.outerHTML = '<div class="empty" id="list"><h2>这个文件夹里没有视频</h2><p>支持常见的视频和音频格式。回到电脑上，换一个文件夹右键试试。</p></div>';
      list = $('list');
      return;
    }
    $('meta').textContent = st.count + (st.truncated ? '+' : '') + ' 个视频';
    renderResume();
    // 状态和进度没变就不重建 DOM（2 秒轮询一次）
    var key = files.map(function(f){ return f.index + ':' + f.state + ':' + Math.round((f.progress || 0) * 100); }).join('|');
    if (key === lastKey) return;
    lastKey = key;
    var current = Pu.store.get('pu:last:' + folderTitle);
    list.innerHTML = files.map(function(f, i){
      var s = f.state === 'transcoding' ? '转码中 ' + Math.round((f.progress || 0) * 100) + '%' : (STATE[f.state] || '');
      var cur = current && stripExt(f.name) === current ? ' current' : '';
      return '<li><button type="button" class="row' + cur + '" data-i="' + f.index + '">'
        + '<span class="no">' + (i + 1) + '</span>'
        + '<span class="name">' + esc(stripExt(f.name)) + '</span>'
        + '<span class="state ' + f.state + '">' + s + '</span>'
        + '<span class="sub"><span>' + Pu.fmtSize(f.sizeBytes) + '</span>' + watched(f) + '</span>'
        + '</button></li>';
    }).join('');
  }

  function renderResume(){
    var last = Pu.store.get('pu:last:' + folderTitle);
    var f = null;
    for (var i = 0; i < files.length; i++) if (stripExt(files[i].name) === last) f = files[i];
    if (!f){ $('resume').hidden = true; return; }
    var pos = parseFloat(Pu.store.get('pu:pos:' + last) || '0');
    $('resumeLabel').textContent = pos >= 15 ? '上次看到 ' + Pu.fmtTime(pos) : '上次看的';
    $('resumeName').textContent = last;
    $('resume').dataset.i = f.index;
    $('resume').hidden = false;
  }

  function open(index, el){
    if (el) el.classList.add('opening');
    fetch('/f/' + token + '/open/' + index, { method: 'POST' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(function(d){ if (d.url) location.href = d.url; })
      .catch(function(){
        if (el) el.classList.remove('opening');
        Pu.toast('没能打开这个文件，稍后再试');
        lastKey = ''; tick();
      });
  }
  list.addEventListener('click', function(e){
    var row = e.target.closest && e.target.closest('.row');
    if (row) open(row.getAttribute('data-i'), row);
  });
  $('resume').addEventListener('click', function(){ open($('resume').dataset.i, $('resume')); });

  function tick(){
    fetch('/f/' + token + '/status?d=' + dev, { cache: 'no-store' })
      .then(function(r){
        if (r.status === 404){ gone(); throw null; }
        if (!r.ok) throw new Error('HTTP ' + r.status);
        return r.json();
      })
      .then(function(d){ $('offline').hidden = true; render(d); })
      .catch(function(e){ if (e) $('offline').hidden = false; });
  }
  function gone(){
    poll.every(0);
    mascot.set('error'); bubble.hide();
    $('title').textContent = '这个链接已经失效了';
    $('meta').textContent = '电脑上的噗噗可能已经退出。回到电脑上重新右键这个文件夹，扫新的二维码。';
    list.innerHTML = ''; $('resume').hidden = true;
  }
  var poll = Pu.poller(tick);
  tick();
  poll.every(2000);
  // 从播放页返回时（bfcache 恢复）观看记录可能变了：强制重画
  window.addEventListener('pageshow', function(){ lastKey = ''; tick(); });
})();
</script>
</body>
</html>
