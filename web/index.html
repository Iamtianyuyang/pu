<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7fb">
<meta name="description" content="噗~噗噗~~噗噗噗噗~~~~ 局域网视频播放页">
<title>噗~噗噗~~噗噗噗噗~~~~</title>
<link rel="icon" type="image/png" href="/assets/pu-logo.png">
<style>
:root{
  --bg:#f5f7fb;
  --surface:#ffffff;
  --surface-2:#eef2f9;
  --line:#dce3ee;
  --line-strong:#c2cede;
  --text:#1e2735;
  --text-2:#4f5c72;
  --text-3:#66738a;
  --blue:#2f5bb5;
  --blue-deep:#1d3f86;
  --blue-hover:#3a6bc9;
  --blue-soft:#e9effa;
  --sky:#78bdf4;
  --green:#2e9463;
  --green-ink:#21724c;
  --green-soft:#e4f4ec;
  --amber-ink:#8a5a10;
  --amber-soft:#fdf3e0;
  --amber-line:#ecd9ae;
  --red:#c02f47;
  --red-soft:#fbeef0;
  --red-line:#efc9cf;
  --ease-out:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:
    radial-gradient(700px 380px at -10% -8%, #e9eff9 0, transparent 62%),
    radial-gradient(620px 420px at 110% 14%, #e7f0fb 0, transparent 64%),
    var(--bg);
  color:var(--text);
  font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  -webkit-font-smoothing:antialiased;
  padding:max(20px,env(safe-area-inset-top)) 18px calc(34px + env(safe-area-inset-bottom));
  max-width:560px;margin:0 auto;
  display:flex;flex-direction:column;gap:16px;
  min-height:100svh;box-sizing:border-box;
}
@media (min-width:600px){ body{ padding-top:48px } }
::selection{background:rgba(47,91,181,.18)}

/* ── header ── */
header{display:flex;align-items:center;gap:13px;min-height:56px}
.logo{width:56px;height:56px;flex:none;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(47,91,181,.16))}
h1{font-size:19px;font-weight:700;letter-spacing:-.2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pill{margin-left:auto;flex:none;display:flex;align-items:center;gap:7px;
  font-size:12.5px;font-weight:550;color:var(--text-2);border:1px solid var(--line);
  border-radius:999px;padding:5px 12px;background:var(--surface);transition:color .25s,background .25s,border-color .25s}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--text-3);transition:background .25s}
.pill.busy{color:var(--blue-deep);background:var(--blue-soft);border-color:#cddbf2}
.pill.busy .dot{background:var(--blue);animation:blink 1.1s ease-in-out infinite}
.pill.ok{color:var(--green-ink);border-color:#c8e5d6;background:var(--green-soft)}
.pill.ok .dot{background:var(--green)}
.pill.bad{color:var(--red);border-color:var(--red-line);background:var(--red-soft)}
.pill.bad .dot{background:var(--red)}
@keyframes blink{50%{opacity:.25}}

/* ── cards ── */
.card{background:var(--surface);border:1px solid var(--line);border-radius:22px;padding:24px 22px;
  box-shadow:0 18px 48px rgba(35,55,95,.08)}
.hidden{display:none!important}
.stage{animation:enter .28s var(--ease-out)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){
  .pill.busy .dot{animation:none}
  .stage{animation:none}
  #barFill{transition:none}
  .bar::after{display:none}
}

/* ── QR ── */
#qrCard{display:flex;flex-direction:column;align-items:center;gap:15px;text-align:center}
.qr-frame{position:relative;background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:0 16px 38px rgba(47,91,181,.12)}
.qr-frame .corner{position:absolute;width:20px;height:20px;border:2.5px solid var(--blue);pointer-events:none}
.qr-frame .corner.tl{top:-5px;left:-5px;border-right:0;border-bottom:0;border-top-left-radius:9px}
.qr-frame .corner.tr{top:-5px;right:-5px;border-left:0;border-bottom:0;border-top-right-radius:9px}
.qr-frame .corner.bl{bottom:-5px;left:-5px;border-right:0;border-top:0;border-bottom-left-radius:9px}
.qr-frame .corner.br{bottom:-5px;right:-5px;border-left:0;border-top:0;border-bottom-right-radius:9px}
#qr{width:204px;height:204px;display:block;image-rendering:pixelated;border-radius:8px}
.qr-hint{font-size:13px;color:var(--text-2)}
.url{font:11.5px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--text-3);word-break:break-all;user-select:all;
  background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:8px 13px;max-width:100%}
.url:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
#planText{font-size:12.5px;color:var(--text-3)}

/* ── progress ── */
#pct{font-size:38px;font-weight:750;text-align:center;letter-spacing:-1px;color:var(--blue-deep);
  font-variant-numeric:tabular-nums;line-height:1.15}
.bar{position:relative;height:8px;border-radius:99px;background:var(--surface-2);
  border:1px solid var(--line);overflow:hidden;margin:16px 0 10px}
#barFill{height:100%;width:0%;border-radius:99px;background:var(--blue);
  transition:width .35s var(--ease-out)}
.bar.indet::after{content:"";position:absolute;inset:0;width:38%;border-radius:99px;
  background:linear-gradient(90deg,transparent,rgba(47,91,181,.35),transparent);
  animation:sweep 1.3s ease-in-out infinite}
@keyframes sweep{from{left:-40%}to{left:104%}}
.bar.indet::after{left:-40%}
.prog-hint{font-size:12.5px;color:var(--text-3);text-align:center}

/* ── player ── */
#playerCard{padding:12px}
.playerWrap{position:relative;border-radius:16px;overflow:hidden;background:#0f1626;
  aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
video{width:100%;height:100%;display:block;outline:none}
.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
  background:rgba(8,12,22,.55);transition:opacity .25s}
.overlay.hidden{opacity:0;pointer-events:none}
#loadingText{display:flex;align-items:center;gap:10px;font-size:13px;color:#c9d4e6;letter-spacing:1px}
.spinner{width:16px;height:16px;border-radius:50%;flex:none;
  border:2px solid rgba(201,212,230,.3);border-top-color:#c9d4e6;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spinner{animation-duration:1.6s} }
#playBtn{display:flex;align-items:center;justify-content:center;width:68px;height:68px;border:0;cursor:pointer;
  background:var(--blue);color:#fff;border-radius:50%;
  box-shadow:0 10px 30px rgba(23,52,112,.45),inset 0 1px 0 rgba(255,255,255,.25);
  transition:transform .15s var(--ease-out),background .2s,box-shadow .2s}
#playBtn svg{width:24px;height:24px;margin-left:3px;fill:currentColor}
#playBtn:hover{transform:scale(1.06);background:var(--blue-hover)}
#playBtn:active{transform:scale(.97)}
#playBtn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
#subsRow{display:flex;flex-wrap:wrap;gap:8px;margin-top:13px}
#subsRow button{border:1px solid var(--line);background:var(--surface-2);color:var(--text-2);
  border-radius:999px;padding:5px 15px;font-size:13px;cursor:pointer;font-family:inherit;
  transition:background .15s,color .15s,border-color .15s}
#subsRow button:hover{border-color:var(--line-strong);color:var(--text)}
#subsRow button.on{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:600}
#subsRow button:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* ── error ── */
#errorCard{display:flex;gap:13px;align-items:flex-start;color:var(--red);
  border-color:var(--red-line);background:var(--red-soft);box-shadow:none}
#errorCard .err-ico{flex:none;display:flex;align-items:center;justify-content:center;
  width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--red-line)}
#errorCard .err-ico svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
#errorCard p{font-size:13.5px;line-height:1.7;padding-top:4px}

/* ── footer：循环夸词 ── */
.foot{margin-top:auto;text-align:center;font-size:11px;color:var(--text-3);
  padding:6px 0 2px;letter-spacing:.3px}
.foot span{display:inline-block;transition:opacity .32s ease,transform .32s ease}
.foot span.swap{opacity:0;transform:translateY(4px)}
@media (prefers-reduced-motion:reduce){.foot span{transition:none}}
</style>
</head>
<body>
<header>
  <img class="logo" src="/assets/pu-logo.png" alt="噗~">
  <h1 id="title">噗~噗噗~~噗噗噗噗~~~~</h1>
  <span class="pill" id="pill" aria-live="polite"><span class="dot"></span><span id="pillText">连接中</span></span>
</header>

<!-- 扫码入口：转码期间一直可见 -->
<section class="card stage" id="qrCard">
  <div class="qr-frame">
    <img id="qr" alt="手机扫码打开的二维码">
    <i class="corner tl" aria-hidden="true"></i><i class="corner tr" aria-hidden="true"></i>
    <i class="corner bl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
  </div>
  <div class="qr-hint">手机或平板扫一扫 · 同一 Wi-Fi</div>
  <div class="url" id="urlText" tabindex="0"></div>
  <div id="planText"></div>
</section>

<section class="card stage hidden" id="progressCard">
  <div id="pct">0%</div>
  <div class="bar indet" id="bar"><div id="barFill"></div></div>
  <div class="prog-hint" id="progHint">正在准备…</div>
</section>

<section class="card stage hidden" id="playerCard">
  <div class="playerWrap">
    <video id="v" controls playsinline preload="auto"></video>
    <div class="overlay hidden" id="loadingOverlay"><span id="loadingText"><span class="spinner" aria-hidden="true"></span>准备播放…</span></div>
    <div class="overlay hidden" id="playOverlay"><button id="playBtn" aria-label="播放"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.5v13c0 .9 1 1.5 1.8 1L20.4 13a1.2 1.2 0 0 0 0-2L9.8 4.5c-.8-.5-1.8.1-1.8 1z"/></svg></button></div>
  </div>
  <div id="subsRow"></div>
</section>

<section class="card stage hidden" id="errorCard">
  <span class="err-ico" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></svg></span>
  <p id="errorText">处理失败。</p>
</section>

<script>
(function(){
  var token = location.pathname.split('/')[2];
  if (!token) { document.body.innerHTML = '<p style="padding:40px;text-align:center">链接无效</p>'; return; }
  var $ = function(id){ return document.getElementById(id); };
  var title=$('title'), pill=$('pill'), pillText=$('pillText'), planText=$('planText'),
      qrCard=$('qrCard'), progressCard=$('progressCard'), playerCard=$('playerCard'),
      errorCard=$('errorCard'), errorText=$('errorText'),
      pct=$('pct'), bar=$('bar'), barFill=$('barFill'), progHint=$('progHint'),
      video=$('v'), subsRow=$('subsRow'),
      loadingOverlay=$('loadingOverlay'), playOverlay=$('playOverlay'),
      playBtn=$('playBtn'), urlText=$('urlText');

  urlText.textContent = location.href;
  qr.src = '/s/' + token + '/qr.png?u=' + encodeURIComponent(location.href);

  var timer = null;

  function show(el){ el.classList.remove('hidden'); }
  function hide(el){ el.classList.add('hidden'); }
  function setPill(t, cls){ pillText.textContent = t; pill.className = 'pill' + (cls ? ' ' + cls : ''); }

  function render(st){
    document.body.dataset.state = st.state; // 调试/测试钩子
    title.textContent = st.title || '噗~噗噗~~噗噗噗噗~~~~';
    document.title = (st.title || '噗~噗噗~~噗噗噗噗~~~~') + ' · 噗~噗噗~~噗噗噗噗~~~~';
    planText.textContent = st.plan || '';

    if (st.state === 'transcoding'){
      // 二维码与进度并存：先扫码，边等边看进度
      setPill('转码中', 'busy');
      show(qrCard); show(progressCard); hide(playerCard); hide(errorCard);
      var p = Math.round((st.progress || 0) * 100);
      barFill.style.width = p + '%';
      bar.classList.toggle('indet', p < 2);
      pct.textContent = p + '%';
      progHint.textContent = st.plan || '正在转码…';
      if (!timer) timer = setInterval(tick, 800);
    } else if (st.state === 'serving'){
      setPill('就绪', 'ok');
      hide(qrCard); hide(progressCard); hide(errorCard); show(playerCard);
      if (timer){ clearInterval(timer); timer = null; }
      if (!video.src){
        buildSubs(st.subtitles || []);
        video.src = '/s/' + token + '/media';
        show(loadingOverlay);
        video.addEventListener('canplay', function(){ hide(loadingOverlay); }, { once:true });
        video.addEventListener('error', function(){
          hide(loadingOverlay);
          setPill('播放失败', 'bad');
        });
        video.play().catch(function(){ show(playOverlay); });
      }
    } else {
      setPill('失败', 'bad');
      hide(qrCard); hide(progressCard); hide(playerCard); show(errorCard);
      errorText.textContent = '处理失败：' + (st.error || '未知错误');
      if (timer){ clearInterval(timer); timer = null; }
    }
  }

  function buildSubs(list){
    subsRow.innerHTML = '';
    list.forEach(function(s, i){
      var t = document.createElement('track');
      t.kind = 'subtitles';
      t.label = s.label || ('字幕 ' + (i + 1));
      if (s.language) t.srclang = s.language;
      t.src = '/s/' + token + '/sub/' + s.index;
      t.mode = 'disabled';
      video.appendChild(t);
      var b = document.createElement('button');
      b.textContent = t.label;
      b.addEventListener('click', function(){ selectSub(i); });
      subsRow.appendChild(b);
    });
    subsRow.style.display = list.length ? '' : 'none';
  }

  function selectSub(i){
    var tracks = video.textTracks;
    for (var j = 0; j < tracks.length; j++) tracks[j].mode = (j === i) ? 'showing' : 'disabled';
    Array.prototype.forEach.call(subsRow.children, function(b, j){ b.classList.toggle('on', j === i); });
  }

  playBtn.addEventListener('click', function(){
    hide(playOverlay);
    video.play().catch(function(){});
  });

  function tick(){
    fetch('/s/' + token + '/status', { cache:'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
      .then(render)
      .catch(function(){ setPill('连接中断', ''); });
  }
  tick();
})();
</script>
<footer class="foot"><span id="queen">全世界最可爱的噗噗大王~</span></footer>
<script>
(function(){
  var words = ['全世界最可爱','无敌漂亮','闪闪发光','人见人爱','笑起来超甜','元气满满','聪明伶俐','宇宙第一美少女'];
  var el = document.getElementById('queen');
  var reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var i = 0;
  setInterval(function(){
    i = (i + 1) % words.length;
    if (reduced) { el.textContent = words[i] + '的噗噗大王~'; return; }
    el.classList.add('swap');
    setTimeout(function(){
      el.textContent = words[i] + '的噗噗大王~';
      el.classList.remove('swap');
    }, 320);
  }, 2800);
})();
</script>
</body>
</html>
