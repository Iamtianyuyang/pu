<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- 16/20/24/32px 专用。去掉高光和第三颗余韵，气团放大、加饱和，
       否则缩到 16px 会糊成一坨看不出形状 -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243449"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>
    <linearGradient id="gas" x1="0.12" y1="0.85" x2="0.88" y2="0.12">
      <stop offset="0"    stop-color="#10B5AE"/>
      <stop offset="0.45" stop-color="#3BE0A8"/>
      <stop offset="1"    stop-color="#B6F5D8"/>
    </linearGradient>
    <mask id="puff">
      <rect width="512" height="512" fill="#000"/>
      <g fill="#fff">
        <circle cx="316" cy="214" r="104"/>
        <circle cx="221" cy="256" r="74"/>
        <circle cx="389" cy="262" r="62"/>
        <circle cx="272" cy="148" r="56"/>
        <circle cx="368" cy="160" r="46"/>
      </g>
      <circle cx="150" cy="342" r="38" fill="#d0d0d0"/>
      <circle cx="82"  cy="398" r="23" fill="#7a7a7a"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#plate)"/>
  <g mask="url(#puff)">
    <rect width="512" height="512" fill="url(#gas)"/>
  </g>
</svg>
