<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 底板：深色，让薄荷绿在浅色/深色任务栏上都能立住 -->
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#243449"/>
      <stop offset="1" stop-color="#0E1626"/>
    </linearGradient>

    <!-- 气体本体：整团用同一道渐变，不是每个圆各来一遍 -->
    <linearGradient id="gas" x1="0.12" y1="0.85" x2="0.88" y2="0.12">
      <stop offset="0"    stop-color="#0EA5A0"/>
      <stop offset="0.45" stop-color="#34D399"/>
      <stop offset="1"    stop-color="#A7F3D0"/>
    </linearGradient>

    <radialGradient id="sheen" cx="0.36" cy="0.3" r="0.5">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34D399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34D399" stop-opacity="0"/>
    </radialGradient>

    <!-- 遮罩定义整团气的轮廓。灰度值 = 透明度，左下的余韵靠这个逐级淡出 -->
    <mask id="puff">
      <rect width="512" height="512" fill="#000"/>
      <g fill="#fff">
        <circle cx="311" cy="221" r="93"/>
        <circle cx="226" cy="258" r="66"/>
        <circle cx="378" cy="264" r="57"/>
        <circle cx="272" cy="163" r="52"/>
        <circle cx="362" cy="172" r="43"/>
      </g>
      <circle cx="163" cy="330" r="31" fill="#c8c8c8"/>
      <circle cx="106" cy="374" r="20" fill="#8a8a8a"/>
      <circle cx="66"  cy="410" r="12" fill="#525252"/>
    </mask>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#plate)"/>
  <rect width="512" height="512" rx="114" fill="url(#glow)"/>

  <g mask="url(#puff)">
    <rect width="512" height="512" fill="url(#gas)"/>
    <rect width="512" height="512" fill="url(#sheen)"/>
  </g>
</svg>
